services:
  - type: web
    name: ecommercegrafica-frontend
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"

      # URL pública da API .NET.
      # NEXT_PUBLIC_* é embutido no bundle em build-time — mudanças exigem redeploy.
      - key: NEXT_PUBLIC_API_URL
        value: https://api.mariacristinagrafica.shop
